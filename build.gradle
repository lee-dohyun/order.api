plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
	id 'jacoco'
}

group = 'com.dh'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	// 이미지 스캔 경고 중 Boot 4.0.8 이 관리하는 버전보다 뒤에 수정본이 나온 것들(gateway#348).
	// Boot 를 올려 관리 버전이 이 값을 넘어서면 해당 줄을 지운다 - 남겨 두면 오히려 낮은 버전에 묶인다.
	set('tomcat.version', '11.0.27')
	set('jackson-bom.version', '3.1.7')
	set('jackson-2-bom.version', '2.21.7')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Boot 4 는 자동 설정을 모듈로 쪼갰다 - 이 스타터가 없으면 Flyway 가 클래스패스에 있어도 부팅 때
	// 마이그레이션이 돌지 않는다(gateway#348).
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// Boot 4 의 웹 계층은 Jackson 3 를 쓰지만 ProductApiClient·AuthApiClient 는 Jackson 2 ObjectMapper 빈을
	// 주입받는다. 이 모듈이 그 빈을 계속 만들어 준다 - 원격 응답 파싱 동작을 그대로 두기 위함이다.
	implementation 'org.springframework.boot:spring-boot-jackson2'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
	implementation 'com.nimbusds:nimbus-jose-jwt:9.48'
	runtimeOnly 'org.postgresql:postgresql'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}

// 커버리지는 리포트만 낸다 - 실패 게이트(jacocoTestCoverageVerification)는 의도적으로 넣지 않는다.
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}
