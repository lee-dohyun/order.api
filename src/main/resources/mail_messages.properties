# 관리자가 트리거하는 고객 메일(출고·환불, order.api#44). 요청 로케일이 고객의 언어가 아니고 회원 언어는
# 저장하지 않으므로 OrderNotificationService 가 한국어로 고정해서 꺼낸다. 번역 번들(messages_*)과 키 집합을
# 맞추는 MessageBundleTest 의 대상이 아니라서 messages.properties 와 따로 둔다 — 회원 언어를 저장하게 되면
# 그때 messages*.properties 로 옮겨 4개 언어로 번역한다.
email.orderShipped.subject=[상품 출고] 주문 #{0}
email.orderShipped.body={0}님, 주문하신 상품이 출고되었습니다.\n\n주문번호: {1}\n택배사: {2}\n운송장번호: {3}\n\n주문 상품\n{4}\n배송지: {5}\n
email.orderShipped.trackLink=\n배송 조회: {0}\n
email.orderRefunded.subject=[환불 처리] 주문 #{0}
email.orderRefunded.body={0}님, 주문이 환불 처리되었습니다.\n\n주문번호: {1}\n환불금액: {2}\n사유: {3}\n\n주문 상품\n{4}\n결제수단에 따라 실제 입금까지 영업일 기준 며칠이 걸릴 수 있습니다.\n
email.itemLine=- {0} × {1}
