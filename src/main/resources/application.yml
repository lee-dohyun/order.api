spring:
  application:
    name: order.api

  datasource:
    url: jdbc:postgresql://${DB_HOST:orders-postgres.customer.svc.cluster.local}:${DB_PORT:5432}/${DB_NAME:ordersdb}
    username: ${DB_USER:orders_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

admin:
  staff-realm-url: ${STAFF_REALM_URL:http://keycloak-service.keycloak.svc.cluster.local/realms/staff}
