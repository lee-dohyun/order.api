spring:
  application:
    name: order.api

  datasource:
    url: jdbc:postgresql://${DB_HOST:orders-postgres.customer.svc.cluster.local}:${DB_PORT:5432}/${DB_NAME:ordersdb}
    username: ${DB_USER:orders_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
