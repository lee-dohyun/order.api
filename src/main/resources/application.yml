spring:
  application:
    name: order.api

  datasource:
    url: jdbc:postgresql://${DB_HOST:orders-postgres.customer.svc.cluster.local}:${DB_PORT:5432}/${DB_NAME:ordersdb}
    username: ${DB_USER:orders_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # 다국어 메시지(ko/en/zh/ja). fallback-to-system-locale을 끄지 않으면 지원하지 않는
  # 언어로 요청이 왔을 때 서버 JVM 로케일을 따라가버린다 — 항상 기본 번들(한국어)로 떨어뜨린다.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

admin:
  staff-realm-url: ${STAFF_REALM_URL:http://keycloak-service.keycloak.svc.cluster.local/realms/staff}

app:
  mail-from: ${MAIL_FROM:customer-service@posselect.com}
  # 주문 금액의 저장 통화. 지금은 KRW 단일 저장이고, 표시 시점 환율 변환은 #108의 몫이다.
  base-currency: ${BASE_CURRENCY:KRW}
