version: 2
updates:
  # Gradle dependencies (Spring Boot service) — SCA rollout per architecture#15 / architecture#17
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # Keep the GitHub Actions workflow files themselves patched too
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
