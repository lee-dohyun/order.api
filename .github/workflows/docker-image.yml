name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get project name from settings.gradle
        run: |
          PROJECT_NAME=$(grep "^rootProject.name" settings.gradle | cut -d'=' -f2 | tr -d " '")
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home]

    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/order-api-deployer.kubeconfig \
            set image deployment/order-api order-api=leedohyun1985/order.api:${{ github.sha }} -n customer

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/order-api-deployer.kubeconfig \
            rollout status deployment/order-api -n customer --timeout=600s
