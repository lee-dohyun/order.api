name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get project name from settings.gradle
        run: |
          PROJECT_NAME=$(grep "^rootProject.name" settings.gradle | cut -d'=' -f2 | tr -d " '")
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.sha }}

      # DevSecOps SCA rollout (architecture#15 / architecture#17): scan the image we just
      # built/pushed for known OS + Java/Gradle vulnerabilities. This step only reports —
      # the gate is the separate step at the end of this job.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy scan results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: "trivy-results.sarif"

      # 배포 게이트(gateway#247): 수정본이 나와 있는 CRITICAL 이 이미지에 있으면 여기서 멈춘다 - deploy 잡이 돌지 않는다.
      # 위 보고 단계와 나눈 이유: severity 를 좁히면 SARIF 에서 HIGH·MEDIUM 이 빠져 Code Scanning 에서 안 보인다.
      # ignore-unfixed 를 끄지 말 것 - 수정본 없는 CVE 가 배포를 무기한 막는다.
      - name: Gate on fixable CRITICAL vulnerabilities
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
          format: "table"
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, k3s-home]

    steps:
      - name: Deploy new image to K3s
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/order-api-deployer.kubeconfig \
            set image deployment/order-api order-api=leedohyun1985/order.api:${{ github.sha }} -n customer

      - name: Wait for rollout
        run: |
          /usr/local/bin/kubectl --kubeconfig=/home/leedohyun/.kube-ci/order-api-deployer.kubeconfig \
            rollout status deployment/order-api -n customer --timeout=600s
