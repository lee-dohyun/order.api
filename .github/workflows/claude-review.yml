# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 주문/결제 API 이며 정합성 요구가 가장 높다.
            
            우선 확인할 것 (실제 사고 이력 기반):
            1. OrderService 는 클래스 레벨이 @Transactional(readOnly = true) 다. 여기에 자체 @Transactional
               없이 쓰기를 추가하면 UPDATE 가 예외도 로그도 없이 사라진다(posselect #211 에서 실제 발생).
            2. 트랜잭션 안의 원격 호출. payOrder 는 트랜잭션 안에서 productApiClient.deductInventory 를 부르는데,
               차감이 성공한 뒤 이후 단계가 실패하면 로컬만 롤백되고 재고는 차감된 채 남는다(보상 트랜잭션 미구현,
               알려진 미해결 결함). 이 경로를 건드리는 변경이면 이 문제를 악화시키지 않는지 볼 것.
            3. 상태 변경 API 의 멱등성. 상태 가드(if status != CREATED)만으로는 동시 요청을 막지 못한다.
            4. 소유자 검사. 식별 키는 Keycloak sub 이며, 불일치는 403 이 아니라 404 로 응답해야 한다(순번 ID 노출 방지).
            5. 가격/상품명을 클라이언트 입력에서 받지 않는가 — 반드시 product.api 조회 결과를 써야 한다.
            
            확실한 결함만 지적할 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
